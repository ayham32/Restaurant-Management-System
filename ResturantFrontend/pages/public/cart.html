    <main>
      <section class="hero-section">
        <h2>Welcome to your cart</h2>
      </section>
      <div class="checkout-body">
        <div class="checkout-shell">
          <div class="checkout-header">
            <div>
              <h2>Checkout</h2>
              <p>Review your basket items</p>
            </div>
            <button id="btnBackShop" class="btn-secondary">
              ⬅ Back to Menu
            </button>
          </div>

          <div class="table-box">
            <div class="section-title">🧺 Basket Summary</div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Quntity</th>
                    <th>price</th>
                    <th>total</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="basketBody"></tbody>
              </table>
            </div>
            <div id="emptyMs" class="empty"></div>

            <div class="summary-row">
              <div class="summary-item">
                <span>Total Amount</span>
                <span id="totalAmount" class="total-value">$0.00</span>
              </div>

              <div class="summary-item">
                <span>Total Preparation Time</span>
                <span id="totalPreparation">0 m</span>
              </div>
            </div>

            <div class="container-buttons">
              <button id="btnClearAll" class="btn-danger">Clear All</button>
            </div>
          </div>
        </div>
      </div>
      <dialog id="productDialog">
        <button id="close-btn" class="close-btn">X</button>
        <h2 id="dialogTitle"></h2>

        <img id="dialogImage" width="250" />

        <p id="dialogPrice" class="total-vlaue"></p>

        <p id="dialogDescription"></p>
      </dialog>
    </main>

    <div id="footer"></div>
  </body>
</html>
