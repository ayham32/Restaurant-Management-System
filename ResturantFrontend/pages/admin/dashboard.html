<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/admin/dashboard.css" />
    <script type="module" src="../../js/global.js"></script>
    <script type="module" src="../../js/admin/dashboard.js"></script>
  </head>
  <body data-role="Admin">
    <div id="header"></div>

    <div class="grid-sidebar-main">
      <div id="sideBar"></div>
      <main>
        <div>
          <div class="head-main">
            <h2>welcome to dashboard</h2>
            <p>This is where the system is managed with ease and smoothness.</p>
          </div>

          <div class="main-container">
            <div class="item">
              <h3>Employees</h3>
              <p id="countActive"></p>
            </div>
            <div class="item">
              <h3>Count Products</h3>
              <p id="countProducts"></p>
            </div>
            <div class="item">
              <h3>Today Orders Count</h3>
              <p id="todayOrdersCount"></p>
            </div>
            <div class="item">
              <h3>Today Revenue</h3>
              <p id="todayRevenue"></p>
            </div>
          </div>

          <div class="table-box">
            <div class="section-title">Last five orders</div>
            <table>
              <thead>
                <tr>
                  <th>Order Id</th>
                  <th>Customer Name</th>
                  <th>Total Price</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
