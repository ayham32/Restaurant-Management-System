<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Management</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/products.css" />

    <script type="module" src="../../js/global.js"></script>
    <script type="module" src="../../js/product.js"></script>
  </head>

  <body data-role="Admin,Employee">
    <div id="header"></div>
    <div class="grid-sidebar-main">
      <div id="sideBar"></div>
      <main>
        <div>
          <div id="pageHeader"></div>
          <div class="box-filter">
            <div>
              <label for="categoryList">Categories: </label>
              <select name="categoryList" id="categoryList"></select>
            </div>
            <div>
              <label for="Name">Name: </label>
              <input
                type="text"
                name="Name"
                id="Name"
                placeholder="search by product name..."
              />
            </div>
            <div>
              <label for="available">Available: </label>
              <select name="available" id="available">
                <option value="">All</option>
                <option value="true">Available</option>
                <option value="false">Not Available</option>
              </select>
            </div>

            <button id="btnSearch">🔍Search</button>
          </div>

          <div
            style="
              display: flex;
              justify-content: center;
              align-items: center;
              flex-wrap: wrap;
            "
          >
            <div id="pagination"></div>
            <button id="btnAdd" class="add-btn">Add New Product</button>
          </div>

          <div id="cardsBox" class="cards-box"></div>
        </div>

        <div id="mess"></div>

        <dialog id="addEditProduct">
          <button class="close-btn" id="btnClose">X</button>
          <h2 id="title">Add New Product</h2>
          <form class="add-new-Form" id="addEditProductForm">
            <div class="add-new-item">
              <label for="name">Name: </label>
              <input type="text" name="name" id="name" required />
            </div>
            <div class="add-new-item">
              <img id="imagePreview" src="" alt="Product image" />
              <input
                type="file"
                name="imageUrl"
                id="imageUrl"
                accept="image/*"
              />
            </div>
            <div class="add-new-item">
              <label for="price">Price: </label>
              <input type="text" name="price" id="price" required />
            </div>
            <div class="add-new-item">
              <label for="quantity">Quantity: </label>
              <input type="Number" name="quantity" id="quantity" required />
            </div>
            <div class="add-new-item">
              <label for="caategoryId">Category: </label>
              <select name="caategoryId" id="caategoryId" required></select>
            </div>
            <div class="add-new-item">
              <label for="preparationTime">Preparation Time: </label>
              <input
                type="text"
                name="preparationTime"
                id="preparationTime"
                required
              />
            </div>
            <div class="add-new-item">
              <label for="isAvailable">IsAvailable? </label>
              <input type="checkbox" name="isAvailable" id="isAvailable" />
            </div>

            <button id="save" class="save">Save</button>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
