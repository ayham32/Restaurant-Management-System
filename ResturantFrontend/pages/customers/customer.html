<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cutomers Management</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <script type="module" src="../../js/global.js"></script>
    <script type="module" src="../../js/customer.js"></script>
  </head>

  <body data-role="Admin,Employee">
    <div id="header"></div>
    <div class="grid-sidebar-main">
      <div id="sideBar"></div>
      <main>
        <div>
          <div id="pageHeader"></div>
          <div class="table-box">
            <div class="search-add">
              <div id="searchContainer"></div>
              <button id="btnAdd">+</button>
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div>
              <p id="records">Record:</p>
            </div>
          </div>
        </div>

        <div id="mess"></div>

        <dialog id="addEditCustomer">
          <button class="close-btn" id="btnClose">X</button>
          <h2 id="title">Add New Category</h2>
          <form class="add-new-Form" id="addEditCustomerForm">
            <div class="add-new-item">
              <label for="name">Name: </label>
              <input type="text" name="name" id="name" required />
            </div>
            <div class="add-new-item">
              <label for="phone">Phone: </label>
              <input type="text" name="phone" id="phone" required />
            </div>
            <div class="add-new-item">
              <label for="address">Address: </label>
              <input type="text" name="address" id="address" required />
            </div>
            <button id="save" class="save">Save</button>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
